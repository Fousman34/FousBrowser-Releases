<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FousBrowser</title>
    <link rel="icon" href="logo.svg" />
    <script src="page.js" defer></script>
    <style>
      /* Стартовая страница профиля: только знак проекта и одна строка поиска.
         Ничего чужого на экране нет — поиск уходит в Google, но его значков
         и заголовков здесь не видно. */
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('JetBrainsMono-Variable.ttf') format('truetype-variations');
        font-weight: 100 800;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #100e16;
        --fg: #e3dce9;
        --faint: #887b96;
        --accent: #b79aff;
        --ok: #ff927c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        background-image: radial-gradient(ellipse at 50% 30%, #30203955, transparent 60%);
        color: var(--fg);
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
      }

      .ambient {
        position: fixed;
        inset: -25%;
        z-index: -2;
        pointer-events: none;
        background: radial-gradient(ellipse at 28% 40%, #734fa528, transparent 40%),
          radial-gradient(ellipse at 72% 65%, #b3554920, transparent 40%);
        animation: drift 24s ease-in-out infinite alternate;
      }
      .grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: .18;
        background-image: linear-gradient(#887b9624 1px, transparent 1px),
          linear-gradient(90deg, #887b9624 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse at center, #000, transparent 72%);
      }
      .clock { margin-bottom: 32px; animation: appear 600ms ease both; }
      time { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 200; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
      .date { margin-top: 4px; color: var(--faint); font-size: .72rem; }
      .emblem { position: relative; width: 128px; height: 128px; margin: auto; display: grid; place-items: center; }
      .emblem::before, .emblem::after {
        content: ''; position: absolute; inset: 0; border: 1px solid #b79aff24;
        border-top-color: var(--accent); border-radius: 50%;
        animation: orbit 22s linear infinite;
      }
      .emblem::after { inset: -10px; border-color: #ff927c12; border-bottom-color: #ff927c88; animation-direction: reverse; animation-duration: 34s; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes drift { to { transform: translate(6%, -4%) rotate(8deg); } }

      main {
        width: min(560px, 86vw);
        padding: 24px 0 48px;
        text-align: center;
        animation: appear 700ms cubic-bezier(.2,.7,.3,1) both;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .logo {
        width: 96px;
        height: 96px;
        display: block;
        margin: 0 auto;
        user-select: none;
        -webkit-user-drag: none;
        animation: float 7s ease-in-out infinite;
      }

      h1 {
        margin: 20px 0 0;
        font-size: 1.5rem;
        font-weight: 600;
        /* Имя пишется как есть: «FOUSBROWSER» читалось бы как аббревиатура. */
        letter-spacing: 0.06em;
      }

      .sub {
        margin: 10px 0 40px;
        color: var(--faint);
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      form {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 2px;
        border-bottom: 1px solid var(--faint);
        border: 1px solid #887b9644;
        border-radius: 16px;
        transition: border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
        background: #1b152266;
        padding: 18px 20px;
      }

      form:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px #b79aff0b, 0 12px 48px #0003;
        transform: translateY(-2px);
      }

      .prompt {
        color: var(--accent);
        font-size: 1rem;
      }

      input {
        min-width: 0;
        flex: 1;
        border: 0;
        outline: 0;
        background: none;
        color: var(--fg);
        font: inherit;
        font-size: 1rem;
        letter-spacing: 0.04em;
        caret-color: var(--accent);
      }

      input::placeholder {
        color: var(--faint);
        letter-spacing: normal;
      }

      .hint {
        margin: 14px 0 0;
        color: var(--faint);
        font-size: 0.7rem;
        letter-spacing: 0.14em;
      }

      .hint .key {
        color: var(--ok);
      }
      .footer { position: fixed; bottom: 22px; font-size: .65rem; letter-spacing: .14em; color: var(--faint); }
      @media (max-height: 620px) { .clock { margin-bottom: 16px; } .emblem { width: 96px; height: 96px; } .sub { margin-bottom: 24px; } .footer { display: none; } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
    </style>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <main>
      <div class="clock"><time aria-label="текущее время"></time><p class="date"></p></div>
      <div class="emblem"><img class="logo" src="logo.svg" alt="" /></div>
      <h1>FousBrowser</h1>
      <p class="sub">ваше пространство в сети</p>

      <form action="https://www.google.com/search" method="get" autocomplete="off">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input
          type="text"
          name="q"
          placeholder="поиск"
          aria-label="поиск"
          autofocus
          spellcheck="false"
        />
      </form>

      <p class="hint"><span class="key">Enter</span> — поиск · <span class="key">/</span> — фокус</p>
    </main>
    <span class="footer">FousBrowser · ваше пространство в сети</span>
  </body>
</html>
