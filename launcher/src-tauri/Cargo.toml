[package]
name = "fousbrowser-launcher"
version = "0.1.0"
description = "FousBrowser launcher — encrypted browser profile manager"
authors = ["Fousman34"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fousbrowser_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }
rand = "0.10.3"
thiserror = "2.0.21"
base64 = "0.23.1"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
directories = "6.0.0"
hex = "0.4.3"
getrandom = "0.4.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
