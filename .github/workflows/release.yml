name: release

# Релиз лаунчера по тегу версии: собираются установщики Windows,
# создаётся черновик релиза, к нему прикладываются контрольные суммы.
#
# Тег: v0.1.0 (совпадает с version в tauri.conf.json).
# macOS и Linux не поддерживаются: сборки для них не выпускаются.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: тесты перед релизом
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кеш сборки Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Тесты ядра
        working-directory: launcher/src-tauri
        shell: bash
        run: cargo test --lib 2>&1 | tee core-tests.log

      - name: Назвать упавшие тесты
        if: failure()
        working-directory: launcher/src-tauri
        shell: bash
        run: |
          if [ -f core-tests.log ]; then
            grep -E '^test .* FAILED' core-tests.log | sed 's/^/::error title=Упавший тест::/' || true
            grep -E '^---- .* stdout ----' core-tests.log | head -n 5 | sed 's/^/::warning::/' || true
            tail -n 40 core-tests.log
          else
            echo "::error::Журнал тестов не создан"
          fi

  bundle:
    name: установщики
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кеш сборки Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Зависимости фронтенда
        working-directory: launcher
        run: npm ci

      - name: Сборка установщиков и черновик релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: "FousBrowser ${{ github.ref_name }}"
          releaseBody: |
            Установщики FousBrowser для Windows.

            - `FousBrowser_*_x64-setup.exe` — установка в профиль пользователя,
              права администратора не нужны.
            - `FousBrowser_*_x64_en-US.msi` — установка через установщик Windows.

            При первом запуске Windows может показать «Windows защитила ваш компьютер»:
            нажмите **Подробнее** → **Выполнить в любом случае**. Это стандартное
            поведение для приложений без платной подписи Authenticode.

            Контрольные суммы — в файле `SHA256SUMS`.
          releaseDraft: true
          prerelease: false

  checksums:
    name: контрольные суммы
    needs: bundle
    runs-on: windows-latest
    steps:
      - name: Скачать собранные файлы из черновика релиза
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --dir dist --clobber \
            --pattern '*.exe' --pattern '*.msi' || true

          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "Нет собранных файлов для подсчёта сумм — пропускаем шаг"
            exit 0
          fi

          cd dist
          sha256sum ./* > ../SHA256SUMS
          cd ..
          cat SHA256SUMS

          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber
