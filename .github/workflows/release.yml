name: release

# Релиз лаунчера по тегу версии: собираются установщики Windows, релиз
# публикуется сразу, к нему прикладываются контрольные суммы SHA-256.
#
# Тег совпадает с version в tauri.conf.json (сейчас 0.1.1).
# macOS и Linux не поддерживаются: сборки для них не выпускаются.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: тесты перед релизом
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кеш сборки Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Тесты ядра
        working-directory: launcher/src-tauri
        shell: bash
        run: cargo test --lib 2>&1 | tee core-tests.log

      - name: Назвать упавшие тесты
        if: failure()
        working-directory: launcher/src-tauri
        shell: bash
        run: |
          if [ -f core-tests.log ]; then
            grep -E '^test .* FAILED' core-tests.log | sed 's/^/::error title=Упавший тест::/' || true
            grep -E '^---- .* stdout ----' core-tests.log | head -n 5 | sed 's/^/::warning::/' || true
            tail -n 40 core-tests.log
          else
            echo "::error::Журнал тестов не создан"
          fi

  bundle:
    name: установщики
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кеш сборки Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Зависимости фронтенда
        working-directory: launcher
        run: npm ci

      - name: Сборка установщиков и черновик релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: "FousBrowser ${{ github.ref_name }}"
          releaseBody: |
            Установщики FousBrowser для Windows.

            - `FousBrowser_*_x64-setup.exe` — установка в профиль пользователя,
              права администратора не нужны.
            - `FousBrowser_*_x64_en-US.msi` — установка через установщик Windows.

            При первом запуске Windows может показать «Windows защитила ваш компьютер»:
            нажмите **Подробнее** → **Выполнить в любом случае**. Это стандартное
            поведение для приложений без платной подписи Authenticode.

            Контрольные суммы — в файле `SHA256SUMS`.
          # Релиз публикуется сразу: установщики уже проверены шагом тестов,
          # а контрольные суммы прикладываются следующей задачей. Ручной шаг
          # «опубликовать черновик» убран намеренно — иначе релиз остаётся
          # недоступным пользователям, пока кто-то не откроет браузер.
          releaseDraft: false
          prerelease: false

      - name: Контрольные суммы установщиков
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Суммы считаются по локальным файлам, а не скачиванием из релиза:
          # прошлый вариант при сбое загрузки молча пропускал шаг, и релиз
          # оставался без SHA256SUMS.
          $items = @(
            Get-ChildItem launcher/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
            Get-ChildItem launcher/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          )
          if ($items.Count -eq 0) {
            Write-Error 'Установщики не найдены — контрольные суммы посчитать нельзя'
            exit 1
          }

          $lines = foreach ($item in $items) {
            "$((Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower())  $($item.Name)"
          }
          $lines | Out-File -FilePath SHA256SUMS -Encoding ascii
          Get-Content SHA256SUMS

          gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Не удалось приложить SHA256SUMS к релизу'
            exit 1
          }
