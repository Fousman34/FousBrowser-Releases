name: engine

# Релиз движка Antidetect: публикация сборки, подписанной нашим ключом.
#
# Почему движок не компилируется здесь: сборка Chromium — это около 100 ГБ
# исходников и много часов на мощной машине; раннеры GitHub для этого не
# предназначены. Фаза A плана движка — зеркалирование готовой сборки
# проекта-основы (ungoogled-chromium с патчами подмены отпечатка) в наши
# релизы, где она подписана нашим ключом.
#
# Как устроена подлинность:
#
#   * Подпись делается там, где лежит приватный ключ (не в CI): в репозитории
#     рядом с манифестом лежат SHA256SUMS и SHA256SUMS.asc.
#   * Этот workflow перед публикацией СКАЧИВАЕТ сборку, проверяет GPG-подпись
#     списка сумм встроенным публичным ключом и сверяет SHA-256 архива.
#   * Если байты не совпали с подписанными — публикация не происходит.
#
# Поэтому секреты здесь не нужны: CI не подписывает, а только проверяет
# и публикует то, что уже подписано.
#
# Запуск: тег `antidetect-v<версия>` (например antidetect-v150.0.7871.186)
# либо вручную с указанием версии.

on:
  push:
    tags:
      - "antidetect-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия движка из каталога browsers/antidetect/<версия>"
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: проверка подписи и публикация
    runs-on: windows-latest
    env:
      ENGINE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        shell: bash
        run: |
          set -euo pipefail
          # Тег имеет вид antidetect-v<версия>; при ручном запуске версия без префикса.
          version="${ENGINE_VERSION#antidetect-v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=antidetect-v${version}" >> "$GITHUB_ENV"
          echo "Версия: ${version}"

      - name: Прочитать манифест релиза
        shell: bash
        run: |
          set -euo pipefail
          dir="browsers/antidetect/${VERSION}"
          if [ ! -f "${dir}/release.json" ]; then
            echo "::error::Нет манифеста ${dir}/release.json — версия не подготовлена к публикации."
            exit 1
          fi
          for file in release.json SHA256SUMS SHA256SUMS.asc; do
            if [ ! -f "${dir}/${file}" ]; then
              echo "::error::В ${dir} нет файла ${file}: без него релиз выпускать нельзя."
              exit 1
            fi
          done

          python - <<'PY' >> "$GITHUB_ENV"
          import json, pathlib, os
          version = os.environ["VERSION"]
          manifest = json.loads(pathlib.Path(f"browsers/antidetect/{version}/release.json").read_text(encoding="utf-8"))
          print(f"ASSET_NAME={manifest['asset_name']}")
          print(f"UPSTREAM_URL={manifest['upstream']['url']}")
          print(f"EXPECTED_SHA256={manifest['published']['sha256']}")
          PY
          echo "Файл релиза: ${ASSET_NAME}"

      - name: Скачать сборку движка
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 --output "dist/${ASSET_NAME}" "${UPSTREAM_URL}"
          ls -l "dist/${ASSET_NAME}"

      - name: Проверить GPG-подпись списка сумм
        shell: bash
        run: |
          set -euo pipefail
          dir="browsers/antidetect/${VERSION}"
          key_file=$(ls launcher/src-tauri/resources/keys/*.asc | head -n 1)

          gpg --batch --quiet --import "${key_file}"
          gpg --batch --verify "${dir}/SHA256SUMS.asc" "${dir}/SHA256SUMS"

          expected=$(gpg --show-keys --with-colons "${key_file}" | awk -F: '/^fpr:/ {print $10; exit}')
          actual=$(gpg --with-colons --verify "${dir}/SHA256SUMS.asc" "${dir}/SHA256SUMS" 2>/dev/null \
            | awk -F: '/^VALIDSIG/ {print ($12 != "" ? $12 : $2); exit}')
          echo "Ключ в лаунчере: ${expected}"
          echo "Ключ подписи:    ${actual}"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::Список сумм подписан не тем ключом, который встроен в лаунчер."
            exit 1
          fi

      - name: Сверить контрольную сумму архива
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum "dist/${ASSET_NAME}" | awk '{print $1}')
          echo "Ожидается: ${EXPECTED_SHA256}"
          echo "Получено:  ${actual}"
          if [ "${actual}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::Архив не совпал с подписанной контрольной суммой — публикация отменена."
            exit 1
          fi
          # Список сумм в релизе должен относиться к имени публикуемого файла.
          grep -q "${actual}  ${ASSET_NAME}" "browsers/antidetect/${VERSION}/SHA256SUMS"

      - name: Проверить, что внутри архива есть движок
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked
          "/c/Program Files/7-Zip/7z.exe" x -y -ounpacked "dist/${ASSET_NAME}" >/dev/null
          found=$(find unpacked -maxdepth 2 \( -iname 'chrome.exe' -o -iname 'fousbrowser.exe' \) | head -n 1)
          if [ -z "${found}" ]; then
            echo "::error::В архиве не найден исполняемый файл движка."
            exit 1
          fi
          echo "Исполняемый файл: ${found}"
          rm -rf unpacked

      - name: Публикация релиза
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="browsers/antidetect/${VERSION}"
          notes=$(python -c "import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))['notes'])" "${dir}/release.json")

          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" \
            --title "Antidetect engine ${VERSION}" \
            --notes "${notes}" \
            --target "${GITHUB_SHA}"

          gh release upload "${TAG}" \
            "dist/${ASSET_NAME}" \
            "${dir}/SHA256SUMS" \
            "${dir}/SHA256SUMS.asc" \
            --clobber
          gh release view "${TAG}"
